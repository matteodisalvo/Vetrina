# Builds the macOS disk image and the Windows executable, and attaches them to a GitHub
# release. It runs when a version tag is pushed (git tag v<version> && git push origin v<version>),
# or by hand from the Actions tab, which only builds them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: bash packaging/build-macos.sh
            files: dist/*.dmg
          - os: windows-latest
            build: pwsh packaging/build-windows.ps1
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install ".[build]"
      - name: Build
        run: ${{ matrix.build }}
      - uses: actions/upload-artifact@v4
        with:
          name: vetrina-${{ matrix.os }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
